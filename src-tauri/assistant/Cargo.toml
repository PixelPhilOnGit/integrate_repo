[package]
name = "devtoolkit-assistant"
version.workspace = true
edition = "2021"
rust-version = "1.89"
description = "Devtoolkit 的助手内核：自研 LLM agent（ReAct 循环 / 两套 provider / 工具 / 上下文策略），不依赖 Tauri"
license = "MIT"

[dependencies]
# 中立的对话模型要能序列化（走 IPC、也要落盘）。
serde = { version = "1", features = ["derive"] }

# 两处用途，都不是可有可无：
#
# 1. **消息 content 用 `RawValue` 原样透传**。provider 会发回来我们不认识的块
#    （thinking / compaction / server_tool_use 之类），**丢掉它们会静默改变行为** ——
#    官方对多轮的要求是「把完整的 response.content 追加回去」。解析成 `Value` 再
#    序列化会让字节变样（键序、浮点格式），那既可能丢信息、也会打乱 prompt 缓存。
#
# 2. 工具的 JSON Schema 与参数都要过它。
#
# `preserve_order` 的理由和 agents 那边一样（它是不开就会「每写一次就把用户文件的键
# 按字母重排」）：这里是**同一个坑的另一个后果** —— 键序变了前缀字节就变了，
# 而 prompt 缓存是逐字节比对前缀的。代价是多一个 indexmap，本来就在依赖树里。
#
# `raw_value` 是**必须显式开的**（不开编译就过不去）：认不出来的内容块要靠
# `RawValue` 逐字节原样带回历史。用 `Value` 中转会重排键序、改写转义和浮点格式 ——
# 那既可能丢信息，也会让 prompt 缓存的前缀对不上。
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }

# 文件工具的路径闸门**只能有一份**。
#
# `Workspace::resolve()` 是整个后端唯一的安全闸门（字面检查 + canonicalize 解符号链接
# + 归属确认），模型给的路径是不可信输入，必须走它。
# 自己再写一份路径解析 = 多一个会漏的地方，而且是**在安全边界上**漏。
devtoolkit-core = { path = "../core" }

# 会话记录落盘（`transcript.rs`）。
#
# ⚠️ 这是这个 crate 最重的一个依赖，得说清楚为什么值得：
# 它是 `bundled` 的 —— SQLite 源码编进来，用户那边不用装任何东西，三个平台一致。
# 而 `store` / `tasks` 用的**是同一个版本、同一组 feature**，所以 cargo 复用
# 同一份编译产物，净增的编译时间接近零。
#
# 为什么不另起一个 crate（像 `store` / `tasks` 那样）：那两处独立是因为它们的
# 消费者**是多个模块**；这份记录只服务助手，而且存的就是这个 crate 自己的类型
# （`Usage` / `RunStatus` / `ContextStrategy`）。拆出去会把一个内部实现细节
# 变成两个 crate 之间的公共契约。理由和失效条件都写在 `transcript.rs` 头部。
rusqlite = { version = "0.32", features = ["bundled"] }

# 这个内核是 async 的（流式 HTTP + 审批要挂起等用户点确认），
# 但**运行时由调用方提供** —— Tauri 那边已经有一个（`tauri::async_runtime`），
# 自己再起一个是在运行时里套运行时的坑，`ssh` 那一轮记过。
#
# 只声明用得到的能力：
# * `sync` —— 审批闸门的 oneshot、取消信号
# * `macros` —— `tokio::select!`（审批要同时等「用户回答」和「取消」两件事）
# * `rt` —— `spawn_blocking`：工具的文件读写是同步 IO，不能在 async 里直接做
# * `process` —— `run_command` 起子进程（`tokio::process`，带超时和 kill）
# * `io-util` —— 读子进程的管道
# * `time` / `net` —— 超时、传输层
tokio = { version = "1", features = ["sync", "macros", "net", "io-util", "rt", "time", "process"] }

# ---------------------------------------------------------------- HTTP / TLS
#
# ⚠️ **这一批已经搬进 `devtoolkit-request` 了**（连同它们那一大段注释 ——
# 「provider 必须显式钉死」那条是这里最贵的知识，现在住在
# `request/Cargo.toml` 和 `request/src/tls.rs` 的注释里）。
#
# 搬走的理由不是「两个模块都要用」，而是形状不对：这一层是给
# 「POST 一段 JSON 拿 SSE 流」定制的，而「接口调试」模块要的是任意方法、
# 完整响应头、任意字节 body、以及能关掉的证书校验。复制两份的话，
# TLS 的 provider 钉死和 Host 头怎么算迟早漂移。
devtoolkit-request = { path = "../request" }

[dev-dependencies]
# 测试要 #[tokio::test]（循环是 async 的）；被测代码自己不起运行时。
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "io-util"] }
# 工具测试要一个真目录当工作区。和 `store` / `tasks` 用的是同一个包，
# 本来就在依赖树里（不新增要编译的东西）。
tempfile = "3"
