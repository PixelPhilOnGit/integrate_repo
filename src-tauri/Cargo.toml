[package]
name = "devtoolkit"
version = "0.7.0"
description = "Devtoolkit —— 开发者工作台：顺序图 / 数据库 / SSH"
authors = ["Devtoolkit"]
edition = "2021"
# 由依赖决定，不是拍脑袋定的：tokio-postgres 要 1.85、russh 要 1.89。
# 写低了不只是"保守" —— cargo 的 MSRV 感知解析会**因此给我挑旧版本的 crate**，
# 结果是在陈旧的 API 上开发，而且升级时才发现问题。
#
# 说清楚：这个值没有在 1.89 上真跑过（CI 用的是 stable 最新版）。
# 它表达的是"最低需要"，不是"验证过的下限"。
rust-version = "1.89"
license = "MIT"
# 前端工程和 Tauri 工程在同一个仓库根目录下，src/ 属于前端，不要打进 crate 里。
exclude = ["core/**", "redis/**", "sql/**", "ssh/**", "agents/**", "target/**"]

[lib]
# Tauri 约定：库名带 _lib 后缀，避免和 bin 目标重名（Windows 上会撞）。
name = "devtoolkit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# 内嵌前端产物，**release 打包必须开**。
#
# 少了它，release 二进制不会内嵌 `../dist`，而是去连 `devUrl`
# （localhost:5173）—— 如果本机恰好开着 dev server，应用看起来一切正常，
# 一旦关掉就白屏报「Could not connect to localhost」。
# 这个坑很隐蔽：开发机上永远是"好的"，装到别人机器上才炸。
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-store = "2.4.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 终端字节在 IPC 上走 base64（两个方向都是）。理由见 ssh_commands.rs
base64 = "0.22"

# 纯逻辑内核（路径安全校验 + 文件操作）。不依赖 tauri，
# 所以 `cargo test -p devtoolkit-core` 可以在没有 WebKit/GTK 的机器上单独跑。
devtoolkit-core = { path = "core" }

# Redis 内核（连接管理 + 命令执行 + 回复解析）。同样不依赖 tauri，
# 集成测试会自己拉起一个真 redis-server 来打。
devtoolkit-redis = { path = "redis" }

# SQL 内核（MySQL / PostgreSQL）。同样不依赖 tauri，
# 集成测试自己拉起真的 pg / mysqld 来打。
devtoolkit-sql = { path = "sql" }

# SSH 内核（连接 / 认证 / 主机密钥 / PTY 会话）。同样不依赖 tauri ——
# 这是它能在无 WebKit 的机器上跑集成测试的原因，也是它**不能**直接拿
# `tauri::ipc::Channel` 的原因：事件出口是一个 mpsc 流，
# 由 `ssh_commands.rs` 在 Tauri 那一层适配成 Channel。
devtoolkit-ssh = { path = "ssh" }

# 智能体会话内核（本地 PTY / 事件目录 / 集成配置读写）。同样不依赖 tauri。
# 和前四个不同的一点：它会**起用户的进程**（shell、claude、codex），
# 那些进程的生命周期管理（关 pane、应用退出不能留孤儿）是这个 crate 的重头戏。
devtoolkit-agents = { path = "agents" }

# 任务内核（SQLite）。同样不依赖 tauri —— 结构迁移和增删改查的测试
# 起一个临时库文件就能跑，不需要 WebKit。
devtoolkit-tasks = { path = "tasks" }

# 键值存储（SQLite）。各模块的档案、指纹、偏好都落在这儿，
# 替掉原来「一个模块一个 JSON 文件」那套。
devtoolkit-store = { path = "store" }

# workspace 根就是 src-tauri 自己，纯逻辑抽成独立 crate 单独编译。
[workspace]
members = ["core", "redis", "sql", "ssh", "agents", "tasks", "store"]
# 不写 default-members 的话，在 src-tauri 下直接敲 `cargo test`
# 只会跑 app crate，**核心那 50 个测试一个都不会跑**，很容易误以为过了。
# 加新 crate 时**必须同步加到这里**，否则它的测试会静默不跑。
default-members = [".", "core", "redis", "sql", "ssh", "agents", "tasks", "store"]
resolver = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
