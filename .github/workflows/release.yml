name: Release

# 推一个 v* 标签就会触发打包并创建 Release：
#   git tag v0.1.0 && git push origin v0.1.0
# 也可以在 Actions 页面手动 workflow_dispatch 跑一次（不会建 Release，只出包）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# tauri-action 需要写权限来创建 Release 并上传产物。
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # 这几套逻辑都是纯 Rust 的（core / redis / ssh 都不依赖 tauri），
  # 所以能在几秒内跑完，不用等 WebKit 装好，也不用等前端构建。
  test:
    name: 单元测试（core + redis + ssh + agents 纯逻辑）
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # devtoolkit-redis 的集成测试会自己拉起一个真 redis-server。
      # 不装的话那些测试会**明确失败并提示安装命令**（刻意不静默跳过 ——
      # 静默跳过等于它们永远不跑而没人发现）。
      - name: 安装 Redis（集成测试要用真实例）
        run: sudo apt-get update && sudo apt-get install -y redis-server

      # 显式列出要跑的 package 而不是用 --workspace：
      # 后者会把 app crate 也拉进来，那就得先装 WebKit/GTK，
      # 这个 job「不装系统依赖、几秒跑完」的意义就没了。
      - name: 跑测试（路径安全 + 文件操作 + Redis）
        working-directory: src-tauri
        run: cargo test --package devtoolkit-core --package devtoolkit-redis --locked

      # SSH：**只跑不需要 root 的那两组**。
      #
      #   session / registry —— 用 russh 自己的服务端在进程内起一个假服务器，
      #                        真 TCP、真握手、真认证，零系统依赖
      #   openssh            —— 打真 sshd，**要 root**（sshd 要切换用户身份），
      #                        runner 上起不来
      #
      # 这里显式列出测试目标而不是整个 package，是因为 `cargo test -p devtoolkit-ssh`
      # 会把 openssh 那组也拉进来，它会明确 panic 说「这组要 root」——
      # 那不是失败，是它诚实地表示自己跑不了（这类测试刻意不静默跳过）。
      #
      # 所以打真 sshd 的那组属于**本机验证**，和 devtoolkit-sql 那组一样
      # （那个也没进 CI，因为 runner 上没有 pg/mysql）。这一点写在 README 里。
      - name: 跑测试（SSH：进程内假服务器，不需要 root）
        working-directory: src-tauri
        run: >-
          cargo test --package devtoolkit-ssh --locked
          --lib --test session --test registry

      # 智能体会话内核里**和平台无关**的那部分（`--lib`）：IPC 契约的字段名、
      # 事件目录怎么拼、以及 Git Bash 探测的规则（候选清单怎么排、什么时候不该
      # 覆盖用户设的值）。
      #
      # 重头戏（起进程、进程树回收、ConPTY）在下面那个 Windows job 里 ——
      # 但上面那些是纯逻辑，在这里跑很便宜，而且**本机就能复现**。
      # 顺带把整个 crate 在 Linux 上编译检查一遍。
      - name: 跑测试（智能体会话：纯逻辑那部分）
        working-directory: src-tauri
        run: cargo test --package devtoolkit-agents --locked --lib

  # 智能体会话那个内核单独一个 job，跑在 **Windows** 上。
  #
  # 为什么非要 Windows：这一套里有几件事**在 Linux 上验不了**，而它们恰恰是
  # 用户最容易踩到的：
  #
  #   * **进程树的回收** —— 关窗格时 `claude` 底下那串 node 到底死没死。
  #     Linux 靠的是进程组（killpg），Windows 靠的是 Job Object
  #     （`KILL_ON_JOB_CLOSE`）—— 后者在 Linux 上连编译都进不去那个分支。
  #   * **ConPTY 的真行为** —— 输出管道什么时候 EOF（这决定了退出事件早到还是晚到
  #     250 毫秒）、resize 会不会重排已显示的内容。
  #   * 包装脚本的批处理形态（换行必须是 CRLF、`goto` 的标号）。
  #
  # 它**是**发布门槛（写进 publish-tauri 的 needs）：Windows 上那些代码路径
  # 在任何别的地方都跑不到，让没在 Windows 上执行过的代码进安装包是更糟的风险。
  #
  # 第一次跑的时候留意一条：portable-pty 0.8.1 依赖的 `serial 0.4` 是**无 target
  # 限定**的依赖（不是 cfg 门控），它支持 Windows 但很老，是这个 job 上唯一
  # 没法在 Linux 本机预验的编译风险。真挂了再谈怎么办。
  test-agents-windows:
    name: 单元测试（智能体会话 / Windows）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # 不需要任何服务端、不需要 WebKit：它起的是本机进程（`cmd.exe`），
      # 用的是系统自带的 PowerShell / tasklist 做断言。
      #
      # 显式列出测试目标而不是整个 package：`tests/claude_schema.rs` 要机器上
      # 真装了 Claude Code（它拿 `claude doctor` 当 schema 校验器），runner 上没有。
      # 那组属于**本机验证**，和 SSH 打真 sshd 的那组同一个待遇 —— 它也是
      # 明确失败并给安装命令，不静默跳过。
      #
      # `--no-fail-fast`：不加的话第一个目标一红，后面的目标**根本没跑** ——
      # 「pty / registry 在 Windows 上到底过不过」就成了一个没人知道答案的问题，
      # 只能一轮一轮试。这一组本来就有大量平台相关的东西，一次报全更省事。
      - name: 跑测试（PTY 进程树 / 事件目录 / 配置读写 / 会话表）
        working-directory: src-tauri
        run: >-
          cargo test --package devtoolkit-agents --locked --no-fail-fast
          --lib --test events --test integration --test pty --test registry

  publish-tauri:
    name: 打包 ${{ matrix.label }}
    # 两个 test job 都要过。`test-agents-windows` 尤其不能省：
    # Windows 上那些代码路径（ConPTY、Job Object 收进程树）**在任何别的地方
    # 都不会被执行到**，让一个「PTY 代码从没在 Windows 上跑过」的包发出去，
    # 正好是这个仓库已经记录过的那类坑（「release 二进制在开发机上永远是好的」）。
    needs: [test, test-agents-windows]
    strategy:
      # 一个平台挂了不要取消其它平台，先把能出的包出来。
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple Silicon)
            platform: macos-latest
            args: '--target aarch64-apple-darwin'
            rust-targets: 'aarch64-apple-darwin'
          - label: macOS (Intel)
            platform: macos-latest
            args: '--target x86_64-apple-darwin'
            rust-targets: 'x86_64-apple-darwin'
          - label: Linux (deb + AppImage)
            platform: ubuntu-22.04
            args: ''
            rust-targets: ''
          - label: Windows (msi + nsis)
            platform: windows-latest
            args: ''
            rust-targets: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 系统依赖
        # Tauri 在 Linux 上要 WebKitGTK 4.1 + GTK3；22.04 才有 libwebkit2gtk-4.1-dev。
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl wget file

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS 交叉编译要显式装目标平台的 std。
          targets: ${{ matrix.rust-targets }}

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
        with:
          # workspace 根就在 src-tauri，target 目录也在那儿。
          workspaces: './src-tauri -> target'
          key: ${{ matrix.args }}

      - name: 安装前端依赖
        run: npm install

      - name: 打包并发布
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Devtoolkit v__VERSION__'
          releaseBody: |
            各平台安装包见下方 Assets。

            * **Windows** —— `.msi`（WiX）或 `.exe`（NSIS，推荐）
            * **macOS** —— `.dmg`（未签名，首次打开需右键 → 打开）
            * **Linux** —— `.deb` 或 `.AppImage`

            完整改动见提交历史。
          # ↓ 先是草稿，方便你先写 release notes 再发布。
          #   想推 tag 就直接对外发布，改成 false。
          releaseDraft: true
          prerelease: false
          # 不传 target 时用 runner 本机架构；macOS 那两条由 matrix.args 指定。
          args: ${{ matrix.args }}

# ---------------------------------------------------------------------------
# 后续要加 macOS 代码签名 + 公证时，改动如下（目前是故意跳过的）：
#
# 1. 申请 Apple Developer 账号，拿到 Developer ID Application 证书，
#    导出成 .p12 并 base64 编码，存成仓库 secret：
#      APPLE_CERTIFICATE            p12 的 base64
#      APPLE_CERTIFICATE_PASSWORD   p12 密码
#      APPLE_SIGNING_IDENTITY       "Developer ID Application: Your Name (TEAMID)"
#      APPLE_ID                     你的 Apple ID
#      APPLE_PASSWORD                App 专用密码（不是账号密码）
#      APPLE_TEAM_ID                10 位 Team ID
#
# 2. 在「打包并发布」这一步的 env 里补上上面几个变量，
#    并把 tauri-action 的 args 里的签名开关去掉（默认就会签）。
#    tauri 自身会读 APPLE_* 环境变量完成签名 + 公证，不需要额外脚本。
#
# 3. Windows 想避免 SmartScreen 警告，同理配
#    WINDOWS_CERTIFICATE / WINDOWS_CERTIFICATE_PASSWORD（EV 证书），
#    并在 bundle.windows 里配 digestAlgorithm / timestampUrl。
#
# 4. 自动更新（tauri-plugin-updater）还需要：
#    - 生成签名密钥：npx tauri signer generate -w ~/.tauri/devtoolkit.key
#    - 把公钥填到 tauri.conf.json 的 plugins.updater.pubkey
#    - 私钥和密码存成 TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#    - 把 tauri-action 的 uploadUpdaterJson 设为 true
# ---------------------------------------------------------------------------
