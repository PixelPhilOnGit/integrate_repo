name: Release

# 推一个 v* 标签就会触发打包并创建 Release：
#   git tag v0.1.0 && git push origin v0.1.0
# 也可以在 Actions 页面手动 workflow_dispatch 跑一次（不会建 Release，只出包）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# tauri-action 需要写权限来创建 Release 并上传产物。
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # 这几套逻辑都是纯 Rust 的（core / redis / ssh 都不依赖 tauri），
  # 所以能在几秒内跑完，不用等 WebKit 装好，也不用等前端构建。
  test:
    name: 单元测试（core + redis + ssh）
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # devtoolkit-redis 的集成测试会自己拉起一个真 redis-server。
      # 不装的话那些测试会**明确失败并提示安装命令**（刻意不静默跳过 ——
      # 静默跳过等于它们永远不跑而没人发现）。
      - name: 安装 Redis（集成测试要用真实例）
        run: sudo apt-get update && sudo apt-get install -y redis-server

      # 显式列出要跑的 package 而不是用 --workspace：
      # 后者会把 app crate 也拉进来，那就得先装 WebKit/GTK，
      # 这个 job「不装系统依赖、几秒跑完」的意义就没了。
      - name: 跑测试（路径安全 + 文件操作 + Redis）
        working-directory: src-tauri
        run: cargo test --package devtoolkit-core --package devtoolkit-redis --locked

      # SSH：**只跑不需要 root 的那两组**。
      #
      #   session / registry —— 用 russh 自己的服务端在进程内起一个假服务器，
      #                        真 TCP、真握手、真认证，零系统依赖
      #   openssh            —— 打真 sshd，**要 root**（sshd 要切换用户身份），
      #                        runner 上起不来
      #
      # 这里显式列出测试目标而不是整个 package，是因为 `cargo test -p devtoolkit-ssh`
      # 会把 openssh 那组也拉进来，它会明确 panic 说「这组要 root」——
      # 那不是失败，是它诚实地表示自己跑不了（这类测试刻意不静默跳过）。
      #
      # 所以打真 sshd 的那组属于**本机验证**，和 devtoolkit-sql 那组一样
      # （那个也没进 CI，因为 runner 上没有 pg/mysql）。这一点写在 README 里。
      - name: 跑测试（SSH：进程内假服务器，不需要 root）
        working-directory: src-tauri
        run: >-
          cargo test --package devtoolkit-ssh --locked
          --lib --test session --test registry

  publish-tauri:
    name: 打包 ${{ matrix.label }}
    needs: test
    strategy:
      # 一个平台挂了不要取消其它平台，先把能出的包出来。
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple Silicon)
            platform: macos-latest
            args: '--target aarch64-apple-darwin'
            rust-targets: 'aarch64-apple-darwin'
          - label: macOS (Intel)
            platform: macos-latest
            args: '--target x86_64-apple-darwin'
            rust-targets: 'x86_64-apple-darwin'
          - label: Linux (deb + AppImage)
            platform: ubuntu-22.04
            args: ''
            rust-targets: ''
          - label: Windows (msi + nsis)
            platform: windows-latest
            args: ''
            rust-targets: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 系统依赖
        # Tauri 在 Linux 上要 WebKitGTK 4.1 + GTK3；22.04 才有 libwebkit2gtk-4.1-dev。
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl wget file

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS 交叉编译要显式装目标平台的 std。
          targets: ${{ matrix.rust-targets }}

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
        with:
          # workspace 根就在 src-tauri，target 目录也在那儿。
          workspaces: './src-tauri -> target'
          key: ${{ matrix.args }}

      - name: 安装前端依赖
        run: npm install

      - name: 打包并发布
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Devtoolkit v__VERSION__'
          releaseBody: |
            各平台安装包见下方 Assets。

            * **Windows** —— `.msi`（WiX）或 `.exe`（NSIS，推荐）
            * **macOS** —— `.dmg`（未签名，首次打开需右键 → 打开）
            * **Linux** —— `.deb` 或 `.AppImage`

            完整改动见提交历史。
          # ↓ 先是草稿，方便你先写 release notes 再发布。
          #   想推 tag 就直接对外发布，改成 false。
          releaseDraft: true
          prerelease: false
          # 不传 target 时用 runner 本机架构；macOS 那两条由 matrix.args 指定。
          args: ${{ matrix.args }}

# ---------------------------------------------------------------------------
# 后续要加 macOS 代码签名 + 公证时，改动如下（目前是故意跳过的）：
#
# 1. 申请 Apple Developer 账号，拿到 Developer ID Application 证书，
#    导出成 .p12 并 base64 编码，存成仓库 secret：
#      APPLE_CERTIFICATE            p12 的 base64
#      APPLE_CERTIFICATE_PASSWORD   p12 密码
#      APPLE_SIGNING_IDENTITY       "Developer ID Application: Your Name (TEAMID)"
#      APPLE_ID                     你的 Apple ID
#      APPLE_PASSWORD                App 专用密码（不是账号密码）
#      APPLE_TEAM_ID                10 位 Team ID
#
# 2. 在「打包并发布」这一步的 env 里补上上面几个变量，
#    并把 tauri-action 的 args 里的签名开关去掉（默认就会签）。
#    tauri 自身会读 APPLE_* 环境变量完成签名 + 公证，不需要额外脚本。
#
# 3. Windows 想避免 SmartScreen 警告，同理配
#    WINDOWS_CERTIFICATE / WINDOWS_CERTIFICATE_PASSWORD（EV 证书），
#    并在 bundle.windows 里配 digestAlgorithm / timestampUrl。
#
# 4. 自动更新（tauri-plugin-updater）还需要：
#    - 生成签名密钥：npx tauri signer generate -w ~/.tauri/devtoolkit.key
#    - 把公钥填到 tauri.conf.json 的 plugins.updater.pubkey
#    - 私钥和密码存成 TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#    - 把 tauri-action 的 uploadUpdaterJson 设为 true
# ---------------------------------------------------------------------------
